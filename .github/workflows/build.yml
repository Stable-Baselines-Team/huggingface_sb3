name: build

on: [workflow_dispatch]

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    # Check out the repository code
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    # Set up the specified Python version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Use uv for faster downloads
        pip install uv
        # cpu version of pytorch
        # See https://github.com/astral-sh/uv/issues/1497
        # Need Pytorch 2.9+ for Python 3.13
        uv pip install --system torch>=2.9.1+cpu --index https://download.pytorch.org/whl/cpu
        uv pip install --system -e ".[dev]"

    # Run tests with pytest and generate coverage report
    - name: Test with pytest
      run: |
        python -c "import os; print(os.environ.get('HF_TOKEN', '')[:3])"
        pytest -v --color=yes --durations=15
